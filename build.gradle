plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.88'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// FIX (2026-09-13, user report): neoforge.mods.toml's version field is
// "${file.jarVersion}", which NeoForge resolves by reading
// Implementation-Version back out of the built jar's own manifest — the
// jar task doesn't set that by default, and the mods.toml token has no
// other fallback. Without it, the in-game Mods screen showed the mod's
// version as the literal placeholder text "0.0NONE" instead of the real
// mod_version from gradle.properties.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_authors,
        ])
    }
}

// FIX (2026-09-01): без этого javac на Windows компилирует .java-файлы в
// системной кодировке (обычно CP1251/CP1252), а не UTF-8 — кириллица в
// строковых литералах (сообщения команд, комментарии) превращается в
// "PsCPpc'sPSPC..." прямо на этапе компиляции. Актуально для любого
// текста на не-английском языке в исходниках, не только для команд.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}
tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}

repositories {
    mavenLocal()
    // MIMI (the mod this addon depends on) is published here — see
    // gradle.properties for the exact version and how to find newer ones.
    exclusiveContent {
        forRepository {
            maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArguments.addAll('--username', 'Dev')
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Real MIMI jar via Modrinth's Maven — no manual jar-vendoring needed.
    // This is what makes InstrumentDetector/TrackScaffolder's calls into
    // io.github.tofodroid.mods.mimi.* actually resolve at compile time.
    implementation "maven.modrinth:mimi:${mimi_version}"
}

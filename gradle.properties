# Sets default memory used for gradle commands.
# FIX (2026-09-01): -Dfile.encoding=UTF-8 added — Gradle's own JVM
# defaults to the OS charset on Windows, which combined with unset javac
# encoding (see build.gradle) was garbling Cyrillic string literals at
# compile time.
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true

## Environment Properties — copied from MIMI's own 1.21.1-neo branch,
## a known-working config, rather than guessed.
minecraft_version=1.21.1
minecraft_version_range=[1.21,1.22)

neo_version=21.1.172
neo_version_range=[21.1,)
neo_loader_version_range=[1,)

# Mappings
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Mod Properties
mod_id=mimieffects
mod_name=MimiEffects
mod_license=MIT License
mod_version=0.1.0
mod_group_id=com.mimieffects
mod_authors=TBD
mod_description=MIMI addon: living music buffs nearby players and repels/kills pests, based on what and how well you play.

## MIMI dependency (pulled from Modrinth's Maven, not vendored as a jar).
## CHECK MODRINTH FOR THE LATEST VERSION STRING before building —
## https://modrinth.com/mod/mimi/versions?l=neoforge&g=1.21.1
## At the time this was written the newest published NeoForge 1.21.1
## build was 1.21.1-4.2.0-neo, but MIMI's own repo already had an
## unreleased 4.3.0 in progress — verify you're not missing API changes.
mimi_version=1.21.1-4.2.0-neo
